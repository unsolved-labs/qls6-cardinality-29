name: Verify construction

on:
  push:
  pull_request:

jobs:
  exact-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Standard-library exact verifier
        run: python verify_qls6_card29.py
      - name: Install independent verifier dependency
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Independent SymPy verifier
        run: python verify_qls6_card29_sympy.py
